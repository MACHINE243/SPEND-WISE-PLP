
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Interactive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <header>
            <h1>SpendWise</h1>
            <p>Track your spending. Spend smarter.</p>
        </header>

        <section class="budget-section">
            <h2>Monthly Budget</h2>
            <div class="budget-input">
                <input type="number" id="budgetInput" placeholder="Enter your budget">
                <button id="setBudgetBtn">Set Budget</button>
            </div>
        </section>

        <section class="dashboard">
            <div class="card">
                <h3>Budget</h3>
                <p id="budgetDisplay">KSh 0</p>
            </div>

            <div class="card">
                <h3>Total Spent</h3>
                <p id="spentDisplay">KSh 0</p>
            </div>

            <div class="card">
                <h3>Remaining</h3>
                <p id="remainingDisplay">KSh 0</p>
            </div>
        </section>

        <p id="budgetMessage">Set your budget to get started.</p>

        <section class="expense-section">
            <h2>Add New Expense</h2>

            <form id="expenseForm">
                <input type="text" id="expenseName"
                    placeholder="Expense name" required>

                <input type="number" id="expenseAmount"
                    placeholder="Amount (KSh)" min="0.01" step="0.01" required>

                <select id="expenseCategory" required>
                    <option value="">Select Category</option>
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Shopping</option>
                    <option>Bills</option>
                    <option>Education</option>
                    <option>Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="history-section">
            <h2>Expense History</h2>
            <ul id="expenseList"></ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
